name: Déployer WebClients

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clients-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -eu
            export PATH="/home/etudiant/.bun/bin:$PATH"
            cd /var/www/clients
            test -f .env
            test -f data/clients.db
            test -z "$(git status --porcelain)"
            git pull --ff-only origin main
            bun install --frozen-lockfile
            bun run build
            sudo -n /usr/bin/systemctl restart clients.service
            curl --fail --silent --show-error --retry 10 --retry-connrefused \
              --retry-delay 2 --max-time 10 -o /dev/null http://127.0.0.1:3344/
            /usr/bin/systemctl is-active --quiet clients.service
            echo "Déploiement WebClients réussi."
